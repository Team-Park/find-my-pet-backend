spring:
  profiles:
    active: dev
  config:
    import: application-topic.yml
  application:
    name: ${spring.profiles.active}-fmp-backend
  data:
    mongodb:
      uri: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:27017/post?authSource=admin
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
  datasource:
    hikari:
      max-lifetime: 1800000 # 30 분
      idle-timeout: 600000 # 10 분
      minimum-idle: 10
      maximum-pool-size: 20
      connection-test-query: SELECT 1
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDBMS_URI:localhost}:3306/findmypet?useUnicode=yes&characterEncoding=UTF-8&connectTimeout=2000&autoReconnect=true&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${RDBMS_USERNAME}
    password: ${RDBMS_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        dialect: org.hibernate.dialect.MySQLDialect
        # Hibernate 6 은 MySQL 에서 기본적으로 enum → native ENUM 컬럼을 기대한다.
        # 우리 마이그레이션은 VARCHAR 를 사용하므로 호환 위해 VARCHAR 로 고정.
        type:
          preferred_enum_jdbc_type: VARCHAR
    show-sql: true
    hibernate:
      # Flyway 가 스키마 소유. Hibernate 6 의 enum ↔ VARCHAR 매핑 불일치로
      # validate 는 false-positive 가 많아 none 으로 고정.
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 0B
      max-file-size: 200MB
      max-request-size: 200MB
  kafka:
    bootstrap-servers: ${consume.kafka.bootstrap.server}
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# custom env
discovery-host:
  auth: 'discovery:///${spring.profiles.active}-${AUTH_NAME}'
  storage: 'discovery:///${spring.profiles.active}-${STORAGE_NAME}'
grpc:
  client:
    auth:
      address: ${discovery-host.auth}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
    storage:
      address: ${discovery-host.storage}
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext

platform-holder:
  cdn:
    domain: ${PLATFORM_HOLDER_CDN_HOST}

consume:
  kafka:
    bootstrap:
      server: ${KAFKA_HOST}