name: Ci with Gradle build test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/cache 는 v1/v2 백엔드가 폐기되어 해당 스텝이 실패한다. cd.yml·version-check.yml 과
      # 아래 test job 은 이미 v4 를 쓰고 있었고 이 job 만 남아 있었다. distribution 도 레거시 별칭
      # adopt 대신 정식 이름 temurin 으로 맞춘다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #  To install packages associated with other private repositories that GITHUB_TOKEN can't access, use a personal access token (classic) with repository scope
      - name: Build and Test with Gradle
        run: ./gradlew clean build -x test --refresh-dependencies --stacktrace -Pgpr.user=PARKPARKWOO -Pgpr.key=${{ secrets.GIT_PASSWORD }}

      - name: Cleanup Gradle Cache
        if: ${{ always() }}
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties